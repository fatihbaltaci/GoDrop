version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        # The download handler serves paths built from validated identifiers,
        # never from client input; see internal/storage.Store.Path.
        - G304
  exclusions:
    presets:
      # Idiomatic Go that errcheck flags anyway: `defer x.Close()`, printing to
      # an already-failing stderr, os.Remove on a temporary file. Checking those
      # returns adds noise without adding safety.
      - std-error-handling
    rules:
      - path: _test\.go
        # A test that builds an http.Response as a fixture is not leaking one.
        linters: [gosec, errcheck, bodyclose]
