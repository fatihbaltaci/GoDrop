# GoDrop behind nginx. The body size limit is the part everyone forgets.
server {
    listen 443 ssl;
    http2 on; # `listen ... http2` is deprecated since nginx 1.25
    server_name files.example.com;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;

    # Must be >= GODROP_MAX_FILE_SIZE. nginx defaults to 1m, which silently
    # breaks every larger upload with an HTML 413 page.
    client_max_body_size 100m;

    # Stream uploads straight through instead of spooling them to disk first.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # GoDrop leaves request timeouts off by default, because cutting a
    # legitimate slow upload in half is worse than the connection it holds, so
    # the proxy is what stops a client from holding one open indefinitely.
    # These are nginx's defaults, spelled out because they are load-bearing:
    # both apply between successive reads and writes rather than to the whole
    # transfer, so a slow but steady upload or download is never interrupted.
    client_body_timeout 60s;
    send_timeout        60s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}
