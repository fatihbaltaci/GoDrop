name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  # The server is meant for Linux, but the CLI is used wherever people work, so
  # the suite runs on all three platforms rather than assuming they behave alike.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Test with the race detector
        run: go test -race -count=1 ./...

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet for other platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            echo "── $target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done

      # The coverage gate is what keeps the promise honest: every statement in
      # internal/ is executed by a test. cmd/godrop is a three-line wiring shim
      # around os.Exit and is excluded deliberately.
      - name: Coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -n 1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          if [ "$(echo "$total < 100" | bc -l)" -eq 1 ]; then
            echo "::error::coverage dropped to ${total}%, which must stay at 100%"
            go tool cover -func=coverage.out | grep -v "100.0%"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Short runs on every change; the seed corpus in testdata/ turns anything
      # ever found into a permanent regression test.
      #
      # Counted rather than timed: a deadline that expires mid-iteration makes
      # `go test` report "context deadline exceeded" as a failure even when
      # nothing was found, which turns the job red at random.
      - name: Fuzz the sanitisers
        run: |
          for target in FuzzSanitizeExt FuzzSanitizeSlug FuzzSplitStoredName; do
            echo "── $target"
            go test ./internal/server/ -run "^$" -fuzz "^${target}$" -fuzztime 300000x
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Pinned rather than "latest": a new release must not turn an unrelated
      # pull request red, and the same version can be run locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Shellcheck the installer and package scripts
        run: shellcheck install.sh packaging/*.sh scripts/*.sh

      # The release workflow only ever runs on a tag, so this is the one thing
      # standing between a typo in it and a failed release.
      - name: Check the workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Building every artefact on each change means a tag never fails on
      # something that could have been caught earlier.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          POSTHOG_KEY: ""
          POSTHOG_HOST: https://eu.i.posthog.com

      - name: Check the produced artefacts
        run: |
          set -euo pipefail
          ls -1 dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk
          test -f dist/SHA256SUMS
          # The installer downloads exactly these names.
          built=$(ls dist/)
          grep -qE 'godrop_.*_linux_amd64\.tar\.gz' <<<"$built"
          grep -qE 'godrop_.*_darwin_arm64\.tar\.gz' <<<"$built"
          grep -qE 'godrop_.*_windows_amd64\.zip' <<<"$built"
          # Listed into a variable first: `dpkg -c | grep -q` makes grep exit
          # early, and the resulting SIGPIPE fails the pipeline under pipefail.
          deb=$(dpkg -c dist/*_linux_amd64.deb)
          grep -q '/usr/bin/godrop' <<<"$deb"
          grep -q 'godrop.service' <<<"$deb"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: godrop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that starts, serves an upload and hands the file back is the
      # only proof that the image itself is correct.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name godrop -p 8747:8747 \
            -e GODROP_TOKENS=ci-token-with-enough-entropy \
            -v godrop-data:/data godrop:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8747/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8747/healthz
          echo "hello from ci" > sample.txt
          url=$(curl -fsS -X POST -H "Authorization: Bearer ci-token-with-enough-entropy" \
                 -F "file=@sample.txt" http://127.0.0.1:8747/upload |
                 sed -n 's/.*"url":"\([^"]*\)".*/\1/p')
          echo "uploaded to $url"
          test "$(curl -fsS "$url")" = "hello from ci"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' -X DELETE \
                 -H "Authorization: Bearer ci-token-with-enough-entropy" "$url")
          test "$code" = "204"
          docker exec godrop /godrop health
          docker logs godrop
          docker rm -f godrop

      - name: Smoke test the image over TLS
        run: |
          set -euo pipefail
          # The health check has to follow the certificate: probing http on
          # the https port marks a healthy container unhealthy for ever.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout key.pem -out cert.pem -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1
          chmod 644 key.pem cert.pem
          docker run -d --name godrop-tls -p 8443:443 -p 8480:80 \
            -e GODROP_TOKENS=ci-token-with-enough-entropy \
            -e GODROP_TLS_CERT=/cert.pem -e GODROP_TLS_KEY=/key.pem \
            -v "$PWD/cert.pem:/cert.pem:ro" -v "$PWD/key.pem:/key.pem:ro" \
            godrop:ci
          for _ in $(seq 1 30); do
            if curl -fsSk https://127.0.0.1:8443/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsSk https://127.0.0.1:8443/healthz
          # Port 80 sends everyone to https rather than serving anything.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' \
                 http://127.0.0.1:8480/f/a/b.jpg)
          test "$code" = "302"
          docker exec godrop-tls /godrop health
          docker logs godrop-tls
          docker rm -f godrop-tls
