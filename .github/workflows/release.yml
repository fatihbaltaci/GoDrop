name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26.x"
  # PostHog project keys are public by design (they are embedded in client-side
  # JavaScript), so this is not a secret. It is injected here rather than
  # compiled in by default so that anything built from source — including
  # `go install` — reports no telemetry at all.
  POSTHOG_KEY: phc_ntEyQ2Qo4rBXn5vMPmjgKP8geWW3bZ6kaDfZonkYXz47
  POSTHOG_HOST: https://eu.i.posthog.com

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build every target
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "── $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w \
                -X main.version=${GITHUB_REF_NAME} \
                -X main.commit=${GITHUB_SHA::7} \
                -X main.date=${date} \
                -X main.posthogKey=${POSTHOG_KEY} \
                -X main.posthogHost=${POSTHOG_HOST}" \
              -o dist/godrop ./cmd/godrop
            tar -czf "dist/godrop_${version}_${os}_${arch}.tar.gz" -C dist godrop
            rm dist/godrop
          done
          cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/godrop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            POSTHOG_KEY=${{ env.POSTHOG_KEY }}
            POSTHOG_HOST=${{ env.POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
