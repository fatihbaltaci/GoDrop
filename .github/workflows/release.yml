name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.26.x"
  # A PostHog project key is public by design — it ships inside client-side
  # JavaScript wherever PostHog is used — so this is not a secret. It lives here
  # rather than in the source so that anything built from source, including
  # `go install`, reports no telemetry at all.
  POSTHOG_KEY: phc_ntEyQ2Qo4rBXn5vMPmjgKP8geWW3bZ6kaDfZonkYXz47
  POSTHOG_HOST: https://eu.i.posthog.com

jobs:
  goreleaser:
    name: Binaries and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog needs the full history

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # A release that ships broken binaries is worse than a late one.
      - name: Test before releasing
        run: go test -race -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        id: goreleaser
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed provenance, so anyone can verify an archive really came from this
      # workflow: gh attestation verify <file> --repo ${{ github.repository }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/godrop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            POSTHOG_KEY=${{ env.POSTHOG_KEY }}
            POSTHOG_HOST=${{ env.POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/godrop
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
