name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.26.x"
  # A PostHog project key is public by design and ships inside client-side
  # JavaScript wherever PostHog is used, so this is not a secret. It lives here
  # rather than in the source so that anything built from source, including
  # `go install`, reports no telemetry at all.
  POSTHOG_KEY: phc_ntEyQ2Qo4rBXn5vMPmjgKP8geWW3bZ6kaDfZonkYXz47
  POSTHOG_HOST: https://eu.i.posthog.com

jobs:
  goreleaser:
    name: Binaries and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the full history

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # A release that ships broken binaries is worse than a late one.
      - name: Test before releasing
        run: go test -race -count=1 ./...

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed provenance, so anyone can verify an archive really came from this
      # workflow: gh attestation verify <file> --repo ${{ github.repository }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `godrop version` inside the image should say the same thing as the
      # binaries in the release: a short commit and the date it was built.
      - id: build_meta
        run: |
          # UTC, and without the leading v, so that the image reports exactly
          # what the archives do. Two spellings of the same release is a
          # question nobody should have to answer.
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"
        env:
          TZ: UTC

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/godrop
          # latest=auto leaves :latest alone for a prerelease, and
          # metadata-action skips the {{major}} and {{major}}.{{minor}} tags
          # for one too. A release candidate must not become what people get
          # when they pull without asking for a version.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            COMMIT=${{ steps.build_meta.outputs.commit }}
            DATE=${{ steps.build_meta.outputs.date }}
            POSTHOG_KEY=${{ env.POSTHOG_KEY }}
            POSTHOG_HOST=${{ env.POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/godrop
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
