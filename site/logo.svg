<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="GoDrop">
  <title>GoDrop</title>
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD8EA"/>
      <stop offset="1" stop-color="#2CB4D8"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M128 20C128 20 214 118 214 158A86 86 0 1 1 42 158C42 118 128 20 128 20Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#inside)">
    <!-- the drop -->
    <path d="M128 20C128 20 214 118 214 158A86 86 0 1 1 42 158C42 118 128 20 128 20Z" fill="url(#drop)"/>

    <!-- the gopher, clipped so it never spills out of the drop -->
    <g fill="#88E5F3" stroke="#17305A" stroke-width="7" stroke-linejoin="round">
      <circle cx="76" cy="152" r="17"/>
      <circle cx="180" cy="152" r="17"/>
      <rect x="72" y="108" width="112" height="150" rx="56"/>
    </g>

    <!-- paws, kept to two: four blobs read as a second pair of eyes -->
    <g fill="#F7DEC4" stroke="#17305A" stroke-width="6">
      <ellipse cx="87" cy="199" rx="16" ry="12"/>
      <ellipse cx="169" cy="199" rx="16" ry="12"/>
    </g>

    <!-- eyes -->
    <g stroke="#17305A" stroke-width="7">
      <circle cx="101" cy="150" r="27" fill="#FFFFFF"/>
      <circle cx="155" cy="150" r="27" fill="#FFFFFF"/>
    </g>
    <g fill="#17305A">
      <circle cx="107" cy="155" r="11"/>
      <circle cx="149" cy="155" r="11"/>
    </g>

    <!-- snout and teeth -->
    <ellipse cx="128" cy="180" rx="14" ry="10" fill="#17305A"/>
    <path d="M118 190h20v12a4 4 0 0 1-4 4h-12a4 4 0 0 1-4-4z" fill="#FFFFFF" stroke="#17305A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M128 190v16" stroke="#17305A" stroke-width="4"/>

    <!-- highlight -->
    <path d="M104 60C88 84 74 108 68 132" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.45" fill="none"/>
  </g>

  <!-- the outline last, so nothing inside crosses it -->
  <path d="M128 20C128 20 214 118 214 158A86 86 0 1 1 42 158C42 118 128 20 128 20Z"
        fill="none" stroke="#17305A" stroke-width="9" stroke-linejoin="round"/>
</svg>
