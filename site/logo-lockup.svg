<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 240" width="830" height="240" role="img" aria-label="GoDrop">
  <title>GoDrop</title>
  <!-- Generated by scripts/logo.py from logo.svg and wordmark.svg. Edit those. -->
  <g transform="translate(20 10) scale(0.859)">
<defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD8EA"/>
      <stop offset="1" stop-color="#2CB4D8"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M128 20C128 20 214 118 214 158A86 86 0 1 1 42 158C42 118 128 20 128 20Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#inside)">
    <!-- the drop -->
    <path d="M128 20C128 20 214 118 214 158A86 86 0 1 1 42 158C42 118 128 20 128 20Z" fill="url(#drop)"/>

    <!-- the gopher, clipped so it never spills out of the drop -->
    <g fill="#88E5F3" stroke="#17305A" stroke-width="7" stroke-linejoin="round">
      <circle cx="76" cy="152" r="17"/>
      <circle cx="180" cy="152" r="17"/>
      <rect x="72" y="108" width="112" height="150" rx="56"/>
    </g>

    <!-- paws, kept to two: four blobs read as a second pair of eyes -->
    <g fill="#F7DEC4" stroke="#17305A" stroke-width="6">
      <ellipse cx="87" cy="199" rx="16" ry="12"/>
      <ellipse cx="169" cy="199" rx="16" ry="12"/>
    </g>

    <!-- eyes -->
    <g stroke="#17305A" stroke-width="7">
      <circle cx="101" cy="150" r="27" fill="#FFFFFF"/>
      <circle cx="155" cy="150" r="27" fill="#FFFFFF"/>
    </g>
    <g fill="#17305A">
      <circle cx="107" cy="155" r="11"/>
      <circle cx="149" cy="155" r="11"/>
    </g>

    <!-- snout and teeth -->
    <ellipse cx="128" cy="180" rx="14" ry="10" fill="#17305A"/>
    <path d="M118 190h20v12a4 4 0 0 1-4 4h-12a4 4 0 0 1-4-4z" fill="#FFFFFF" stroke="#17305A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M128 190v16" stroke="#17305A" stroke-width="4"/>

    <!-- highlight -->
    <path d="M104 60C88 84 74 108 68 132" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.45" fill="none"/>
  </g>

  <!-- the outline last, so nothing inside crosses it -->
  <path d="M128 20C128 20 214 118 214 158A86 86 0 1 1 42 158C42 118 128 20 128 20Z"
        fill="none" stroke="#17305A" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <g transform="translate(256 16)">
<!--
    The letters are drawn rather than set, so the wordmark looks the same
    everywhere instead of depending on a font being installed.
    A rounded geometric sans built from arcs of a single weight, to match the
    mark. Cap height 58 to 150, x-height 78 to 150, descender to 186; the round
    letters overshoot those lines slightly, as they must to look level.
  -->
  <style>
    /* Navy on a light background, near-white on a dark one. Without this the
       word disappears on a dark README or a dark browser theme. */
    .ink { stroke: #17305A }
    @media (prefers-color-scheme: dark) { .ink { stroke: #EAF6FB } }
  </style>

  <g fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Go -->
    <g stroke="#2CB4D8">
      <path d="M118 104A47 47 0 1 1 98 65"/>
      <path d="M118 104H92"/>
      <circle cx="174" cy="114" r="36"/>
    </g>

    <!-- Drop -->
    <g class="ink">
      <path d="M232 58v92"/>
      <path d="M232 58h16a46 46 0 0 1 0 92h-16"/>
      <path d="M316 78v72"/>
      <path d="M316 112a34 34 0 0 1 34-34"/>
      <circle cx="408" cy="114" r="36"/>
      <path d="M466 78v108"/>
      <circle cx="502" cy="114" r="36"/>
    </g>
  </g>
  </g>
</svg>
